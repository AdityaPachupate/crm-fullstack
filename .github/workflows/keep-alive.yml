name: Keep Backend Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render's 15-minute spin-down
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: |
          curl -f https://crm-api-vy8f.onrender.com/api/health/live || echo "API might be starting up..."
